name: CI

on:
  push:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: read
      pull-requests: read
    steps:
      - name: Check linked issue and PR length
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const body = (context.payload.pull_request.body || '').trim();
            const firstLine = body.split(/\r?\n/)[0];
            const match = /^(?:Closes|Fixes) #([1-9]\d*)$/i.exec(firstLine);
            if (!match) {
              throw new Error('PR 首行必须为 Closes #N 或 Fixes #N，关联本仓库一个开放 Issue。');
            }
            const text = body.replace(/^\s*(`{3,}|~{3,})[^\n]*\n[\s\S]*?^\s*\1[ \t]*$/gm, '');
            if (Array.from(text).length > 700) {
              throw new Error('PR 正文过长；写作目标为 600 字以内，不含已闭合代码块。');
            }
            const refs = text.match(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+(?:(?:[\w.-]+\/[\w.-]+)?#\d+|https:\/\/github\.com\/\S+)/gi) || [];
            if (refs.length !== 1) {
              throw new Error('一个 PR 只能关闭一个 Issue，请只保留首行关闭引用。');
            }
            const { data: issue } = await github.rest.issues.get({
              ...context.repo,
              issue_number: Number(match[1]),
            });
            if (issue.pull_request || issue.state !== 'open') {
              throw new Error('关联目标必须是本仓库尚未关闭的 Issue，不能是 PR。');
            }

  repository-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check committed whitespace
        run: git show --format= --check HEAD
      - name: Check repository files
        run: python3 .github/scripts/check_repository.py

  ci-gate:
    name: ci-gate
    if: always()
    needs: [pr-policy, repository-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    env:
      EVENT_NAME: ${{ github.event_name }}
      POLICY_RESULT: ${{ needs.pr-policy.result }}
      REPOSITORY_RESULT: ${{ needs.repository-checks.result }}
    steps:
      - name: Require successful checks
        shell: bash
        run: |
          test "$REPOSITORY_RESULT" = success
          if [[ "$EVENT_NAME" == pull_request ]]; then
            test "$POLICY_RESULT" = success
          else
            test "$POLICY_RESULT" = skipped
          fi
